[project]
name = "itrx"
version = "0.5.0"
description = "A chainable iterator adapter"
readme = "README.md"
authors = [
    { name = "virgesmith", email = "andrew@friarswood.net" }
]
license = "MIT"
license-files = ["LICENCE.md"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/virgesmith/itrx"
"Bug Tracker" = "https://github.com/virgesmith/itrx/issues"

[project.scripts]
itrx-skill = "itrx.skill_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[project.optional-dependencies]
examples = [
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = [
  "."
]
addopts = "--cov=src/itrx --cov-report html --cov-fail-under=100 --doctest-modules --doctest-glob=README.md"

[tool.ty.src]
exclude = ["doc/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ARG", "B", "C", "D103", "E", "F", "I", "N", "PERF", "PTH", "RET", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/test/*.py" = ["D103"]
